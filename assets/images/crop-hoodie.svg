<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" fill="none">
  <defs>
    <linearGradient id="crop-body" x1="120" y1="100" x2="320" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ededf2"/>
      <stop offset="1" stop-color="#d8d8e0"/>
    </linearGradient>
    <linearGradient id="crop-sleeve" x1="60" y1="130" x2="140" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7fa"/>
      <stop offset="1" stop-color="#dfdfe6"/>
    </linearGradient>
    <filter id="crop-shadow" x="10" y="24" width="420" height="420" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
